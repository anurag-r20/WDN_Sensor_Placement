[pytest]
# Adding the repository root to sys.path lets the tests write "from src import network" (and import the
# migrate_logs.py script) without installing anything. tests/oracles is added so every test can import
# the brute-force pseudo-oracle in enumeration_solver.py.
pythonpath = . tests/oracles
testpaths = tests

# Tests marked @pytest.mark.xfail document a confirmed bug (see docs/code_review.md). strict means
# that once the bug is fixed the test "unexpectedly passes" and the run FAILS, which reminds you to
# delete the xfail marker so the test guards the fix from then on.
xfail_strict = true

markers =
    integration: end-to-end runs through several functions and real samplers (deselect with -m "not integration")
